# SPDX-License-Identifier: MIT

version = 1
SPDX-PackageName = "FlowPlus"
SPDX-PackageSupplier = "FlowPlus Contributors"
SPDX-PackageDownloadLocation = "https://github.com/Kibra2025/FlowPlus"

[[annotations]]
path = [
   ".github/**"
 , ".clang-format"
 , ".editorconfig"
 , ".gitattributes"
 , ".gitignore"
 , "cspell.json"
 , "sonar-project.properties"
 , "cmake/vcpkg.json.in"
 , "**/*.md"
 , "docs/**"
 , "deploy/linux/flatpak/**"
 , "deploy/linux/io.github.kibra2025.FlowPlus.metainfo.xml"
 , "deploy/windows/wix-patch.xml.in"
 , "src/apps/deskflow-client/deskflow-client.exe.manifest"
 , "src/apps/deskflow-core/deskflow-core.exe.manifest"
 , "src/apps/deskflow-server/deskflow-server.exe.manifest"
 , "src/apps/res/manpage.txt"
 , "src/apps/res/deskflow.plist.in"
 , "src/apps/res/entitlements-dev.plist"
 , "translations/*.ts"
]
SPDX-FileCopyrightText = "Deskflow Developers"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [
   "src/apps/res/deskflow.qrc"
]
SPDX-FileCopyrightText = "Deskflow Developers"
SPDX-License-Identifier = "GPL-2.0-only"

[[annotations]]
path = "src/apps/res/icons/deskflow-**/**/**/**.svg"
SPDX-FileCopyrightText = "Kde Breeze Icons"
SPDX-License-Identifier = "LGPL-2.1-only"

[[annotations]]
path = "src/apps/res/icons/deskflow-**/index.theme"
SPDX-FileCopyrightText = "Chris Rizzitello <sithlord48@gmail.com>"
SPDX-License-Identifier = "LGPL-2.1-only"

[[annotations]]
path = [
   "src/lib/gui/MainWindow.ui"
 , "src/lib/gui/dialogs/*.ui"
]
SPDX-FileCopyrightText = "Deskflow Developers"
SPDX-License-Identifier = "GPL-2.0-only WITH LicenseRef-OpenSSL-Exception"

[[annotations]]
path = [
   "src/apps/res/flowplus*.svg"
 , "src/apps/res/flowplus.ico"
 , "src/apps/res/FlowPlus.icns"
 , "deploy/linux/io.github.kibra2025.FlowPlus.png"
 , "deploy/mac/flowplus-dmg*"
 , "deploy/windows/flowplus-wix*.png"
 , "README.md"
 , "NOTICE.md"
 , "THIRD_PARTY_NOTICES.md"
 , "docs/ARCHITECTURE.md"
 , "docs/TESTING.md"
 , "docs/LICENSING.md"
 , "docs/images/flowplus-interface.png"
]
precedence = "override"
SPDX-FileCopyrightText = "2026 FlowPlus Contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "docs/third-party/LocalSend-LICENSE.txt"
precedence = "override"
SPDX-FileCopyrightText = "2022-2026 Tien Do Nam"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "src/apps/res/icons/deskflow-**/**@*"
SPDX-FileCopyrightText = "Kde Breeze Icons"
SPDX-License-Identifier = "LGPL-2.1-only"

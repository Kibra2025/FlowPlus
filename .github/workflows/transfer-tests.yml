name: Transfer regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          cache: true
      - name: Configure isolated transport tests
        run: cmake -S src/unittests/transfer -B build/transfer -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/transfer --config Release --parallel 4
      - name: Test
        run: ctest --test-dir build/transfer -C Release --output-on-failure
      - name: Configure isolated startup tests
        run: cmake -S src/unittests/startup -B build/startup -DCMAKE_BUILD_TYPE=Release
      - name: Build startup tests
        run: cmake --build build/startup --config Release --parallel 4
      - name: Test first-launch permission flow
        run: ctest --test-dir build/startup -C Release --output-on-failure
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: transfer-test-logs-${{ matrix.os }}
          path: |
            build/transfer/Testing/Temporary/
            build/startup/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7

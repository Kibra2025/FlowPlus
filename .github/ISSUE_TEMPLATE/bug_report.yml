name: Bug report
description: If you find a bug in FlowPlus, please let us know so we can fix it.
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to help us improve FlowPlus.

        <b>Sanity checks</b>
        > [!IMPORTANT]
        > 1. Try the latest [continuous build](https://github.com/Kibra2025/FlowPlus/releases).
        > 2. Review the file transfer limitations and manual checklist in this repository.
        > 3. For macOS launch or permission problems, read the [FlowPlus setup notes](https://github.com/Kibra2025/FlowPlus#macos-permissions-and-first-launch). A Gatekeeper warning is different from an application crash.
        > 4. Search for existing issues and avoid creating duplicates.
        > 5. Provide descriptive title for this issue.

  - type: checkboxes
    id: sanity-checks
    attributes:
      label: Before reporting a bug, please complete the sanity checks above.
      description: This helps us triage and resolve issues more efficiently.
      options:
        - label: I have done the sanity checks, and my issue persists.
          required: true

  - type: textarea
    id: version
    attributes:
      label: FlowPlus version info
      description: Please paste only the FlowPlus version info, accessible via the **Help** menu in the **About** dialog using the **Copy version info** button.
      placeholder: |
        FlowPlus: 1.2.3.4 (deadc0de)
        Qt: 3.2.1
        System: Hannah Montana Linux (Workstation Edition)
        Session: Unity (Compiz)
    validations:
      required: true

  - type: dropdown
    id: build
    attributes:
      label: Build types
      description: What kind of builds are you running for all servers and clients?
      multiple: true
      options:
        - Official release (installer/package from GitHub releases)
        - Community package (apt, dnf, pacman/aur, brew, etc.)
        - Local developer build (built it myself)
        - Other (please specify)
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: FlowPlus configuration
      description: |
        Please provide a very brief description of your configuration.
        There is no need to provide operating system details here, as they are included when you paste the version info in the **FlowPlus version info** section above.
        If you're using Linux, please provide the name of the distribution.
      placeholder: |
        - Windows 11 server, Ubuntu client, and macOS 15 client
        - Each computer has a single monitor
        - Windows is in the center, Ubuntu is on the left, and macOS is on the right
    validations:
      required: true

  - type: textarea
    id: repro-steps
    attributes:
      label: What steps will reproduce the problem?
      description: |
        Please list the _numbered steps_ to reproduce the issue.
        If you're not sure, please provide as much detail as possible.
      placeholder: |
        1. Start FlowPlus
        2. Click 'Configure Server'
        3. Click 'Apply'

  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: |
        Please copy and paste any relevant log output.
        This will be automatically formatted into code, so no need for backticks.
      value: |
        <details><summary><h3> Show log </h3></summary>

        <!-- Please paste your log into the code block below -->
        ```ceylon

        ```

        </details>

  - type: textarea
    id: additional-info
    attributes:
      label: Additional information
      description: |
        Please provide any additional information that may help us understand the issue.
        This could include screenshots, error messages, or anything else you think is relevant.
        - Any ideas about what maybe causing the problem?
        - Any workarounds that you've discovered?
        - What other apps are you running?
        - Does the issue stop you using FlowPlus entirely?
        - Did restarting FlowPlus or the computer help?
        - Are the locales matching across all your systems?
        - Anything else you can think of?
